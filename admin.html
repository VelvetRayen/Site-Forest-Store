<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin | Forest Store</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
</head>
<body>
  <main id="login-view" class="login">
    <form id="login-form" class="card">
      <h1>Forest Admin</h1>
      <p class="muted">Enter the admin password to continue.</p>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="bar">
      <strong>Forest Admin</strong>
      <nav id="tabs">
        <button data-tab="products" class="active">Products</button>
        <button data-tab="orders">Orders</button>
        <button data-tab="reviews">Reviews</button>
        <button data-tab="users">Users</button>
      </nav>
      <button id="logout" class="btn">Log out</button>
    </header>
    <section class="panel">
      <div class="tools">
        <input id="search" type="search" placeholder="Search…">
        <button id="refresh" class="btn">Refresh</button>
      </div>
      <div id="content"></div>
    </section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
